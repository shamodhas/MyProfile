<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Me - Shamodha</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
    }

    form {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      position: relative;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #128C7E;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
      text-align: center;
    }

    /* Loader */
    .loader {
      display: none;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #25D366;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- EmailJS SDK -->
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("1fNAQAXPl52LD1dNQ"); // Your public key
    })();
  </script>
</head>

<body>

  <!-- Logo -->
  <img src="assets/image/log.jpg" alt="Shamodha Logo" class="logo">

  <!-- Contact Form -->
  <form id="contactForm">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
    <button type="submit">Send Email</button>
    <div class="loader" id="loader"></div>
    <p id="status"></p>
  </form>

  <script>
    const form = document.getElementById('contactForm');
    const status = document.getElementById('status');
    const loader = document.getElementById('loader');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      status.innerText = "";
      loader.style.display = "block";

      emailjs.sendForm('service_u9uuncj', 'template_tyol2t7', this)
        .then(() => {
          loader.style.display = "none";
          status.style.color = "green";
          status.innerText = "Email sent successfully!";
          form.reset();
        })
        .catch((err) => {
          loader.style.display = "none";
          status.style.color = "red";
          status.innerText = "Failed to send email. Check console for details.";
          console.error("EmailJS error:", err);
        });
    });
  </script>

</body>
</html>
