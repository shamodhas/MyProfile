<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact via Email - Shamodha</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
    }

    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #25D366;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    p {
      font-size: 16px;
      color: #333;
    }

    a.button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background: #25D366;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
    }

    a.button:hover {
      background: #128C7E;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <img src="assets/image/log.jpg" alt="Shamodha Logo" class="logo">

  <!-- Loader -->
  <div class="loader" id="loader"></div>
  <p id="message">Preparing your email...</p>

  <!-- Manual fallback button -->
  <a id="manualLink" href="mailto:shamodha7@gmail.com?subject=Contact%20from%20Website&body=Hello%20Shamodha," class="button" style="display:none;">
    Click here if email did not open automatically
  </a>

  <script>
    // Auto open mail client after short delay
    window.onload = function() {
      const mailtoURL = "mailto:shamodha7@gmail.com?subject=Contact%20from%20Website&body=Hello%20Shamodha,";
      try {
        // Attempt automatic open
        window.location.href = mailtoURL;
        // After 3 seconds, show manual button
        setTimeout(() => {
          document.getElementById('manualLink').style.display = "inline-block";
          document.getElementById('message').innerText = "If the email did not open, click the button below.";
          document.getElementById('loader').style.display = "none";
        }, 3000);
      } catch (err) {
        console.error(err);
        document.getElementById('loader').style.display = "none";
        document.getElementById('manualLink').style.display = "inline-block";
        document.getElementById('message').innerText = "Unable to open email automatically. Please click the button below.";
      }
    }
  </script>

</body>
</html>
